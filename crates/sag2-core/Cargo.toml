[package]
name = "sag2-core"
description = "SAG2 text core: the §4 tokenizer and the Unicode tables it needs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Japanese/Korean morphological segmentation over a runtime dictionary
# directory (`multilingual-v1-ja`/`-ko`).  Off by default: the default build
# keeps the workspace MSRV and compiles no dictionary code.  `lindera` 6.2
# requires Rust 1.88; its `mmap` default feature is off, so the dictionary is
# a plain read and nothing is downloaded at build time.
lindera = ["dep:lindera", "dep:sha2"]

[dependencies]
# `default-features = false` drops the crate's bundled dictionary; the
# certified jieba 0.42.1 `dict.txt` is the only dictionary this port loads
# (design §4.3).
jieba-rs = { version = "0.7.4", default-features = false }
# Thai word segmentation (`multilingual-v1-th`).  The crate ships the newmm
# algorithm only, so the word list comes from `data/thai/words_th.txt`.
nlpo3 = "1.4"
# Japanese/Korean segmentation (`multilingual-v1-ja`/`-ko`), feature `lindera`.
lindera = { version = "6.2", default-features = false, optional = true }
# Dictionary provenance (`segment::lindera_seg::LinderaSegmenter::fingerprint`).
sha2 = { version = "0.10", optional = true }

[dev-dependencies]
# The multilingual recall fixture builds a real index, so the test needs the
# storage crate that depends on this one (a dev-dependency cycle cargo allows).
sag2-index = { path = "../sag2-index" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
# The vendored Thai word list is pinned by digest (`data/PROVENANCE.md`).
sha2 = "0.10"

[build-dependencies]
flate2 = "1.1"
